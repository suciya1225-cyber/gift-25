<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Some Memories 💖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Menghilangkan margin bawaan dan mengunci tinggi penuh 100% */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center bg-pink-100 relative overflow-hidden select-none">

    <!-- Efek Bintang/Berkilau Sederhana (Background Decorative) -->
    <div class="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#f472b6_1px,transparent_1px)] [background-size:16px_16px]"></div>

    <!-- 1. HEADER (Bagian Atas) -->
    <header class="w-full pt-8 pb-2 flex justify-center items-center z-10">
        <h1 class="text-pink-600 font-bold text-xl sm:text-2xl tracking-wide flex items-center gap-1 drop-shadow-sm">
            Some Memories 💖
        </h1>
    </header>

    <!-- 2. KONTEN GALERI POLAROID (Bagian Tengah - Memenuhi Ruang Utama) -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center px-4 gap-6 z-10">
        
        <!-- Baris Polaroid 1 -->
        <div class="w-full flex justify-between items-center relative px-2">
            <!-- Tali Penggantung -->
            <div class="absolute top-1/2 left-0 w-full h-[2px] bg-stone-700 -z-0 rounded"></div>

            <!-- Foto 1 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform -rotate-6 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 1" class="w-full h-full object-cover">
                </div>
            </div>
            <!-- Foto 2 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform rotate-3 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 2" class="w-full h-full object-cover">
                </div>
            </div>
            <!-- Foto 3 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform -rotate-3 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 3" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Baris Polaroid 2 -->
        <div class="w-full flex justify-between items-center relative px-2">
            <div class="absolute top-1/2 left-0 w-full h-[2px] bg-stone-700 -z-0 rounded"></div>

            <!-- Foto 4 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform rotate-6 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 4" class="w-full h-full object-cover">
                </div>
            </div>
            <!-- Foto 5 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform -rotate-6 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 5" class="w-full h-full object-cover">
                </div>
            </div>
            <!-- Foto 6 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform rotate-4 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 6" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Baris Polaroid 3 -->
        <div class="w-full flex justify-between items-center relative px-2">
            <div class="absolute top-1/2 left-0 w-full h-[2px] bg-stone-700 -z-0 rounded"></div>

            <!-- Foto 7 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform -rotate-4 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 7" class="w-full h-full object-cover">
                </div>
            </div>
            <!-- Foto 8 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform rotate-2 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 8" class="w-full h-full object-cover">
                </div>
            </div>
            <!-- Foto 9 -->
            <div class="bg-white p-1.5 pb-5 shadow-lg rounded transform -rotate-6 z-10 w-24 sm:w-28 transition hover:scale-105">
                <div class="w-full h-20 sm:h-24 bg-gray-200 rounded overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Memory 9" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

    </main>

    <!-- 3. FOOTER (Bagian Bawah Layar) -->
    <footer class="w-full pb-8 flex justify-center items-center z-10">
        <button class="bg-amber-200/90 hover:bg-amber-300 text-amber-900 font-semibold text-xs px-6 py-2 rounded-full shadow-md tracking-wider transition">
            NEXT 💖
        </button>
    </footer>

</body>
</html>
